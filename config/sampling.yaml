# Step 1: how each round's structures are generated (generate_structures.py).
# Defaults are starting points, NOT validated for your material system.

structures_per_round: 1000       # unique structures per round (after the exact-duplicate check)
max_atoms: 120                   # per structure; hard limit 120 (larger values are capped)
isolated_vacuum_A: 6.0           # vacuum on each side of gas / dimer / trimer boxes
slab_vacuum_A: 12.0              # vacuum above slab, interface and adsorbate cells
seed: 0

# Round 0: built from the crystal templates in runs/species.json (no NEP yet).
# Relative share of each family; families with nothing to build from (e.g.
# compound with no interfacial compounds) are dropped and the rest renormalised.
round0:
  weights:
    bulk: 3          # film, substrate and elemental crystals
    slab: 2          # film and substrate surfaces
    interface: 2     # film on substrate
    dimer: 1
    trimer: 1
    adsorbate: 2     # gas molecules, fragments and inert atoms on film/substrate surfaces
    defect: 1        # a single point defect in bulk: vacancy, substitution (the only source of substitutions) or interstitial
    gas: 1           # isolated gas molecules, fragments and atoms
    compound: 1      # interfacial compounds
    repulsion: 1     # short-range repulsion: dimers/trimers at very short distances
  # Pristine: a few defect-free, unstrained, unrattled structures, written in
  # round 0 only -- every crystal (film, substrate, elements, interfacial
  # compounds) and every surface (film and substrate slab, interface) at
  # several supercell sizes. Everything else is non-pristine.
  pristine:
    supercell_sizes: 4           # sizes per crystal / surface, spread from the smallest to the largest that fits
  # Point defects in every non-pristine solid structure: bulk, compound, slab,
  # interface, the slab under an adsorbate, and the MD starting cells
  # (amorphous, collision targets) in rounds 1..N. Concentrations are drawn
  # uniformly per structure, as a fraction of its atoms.
  point_defects:
    vacancy_fraction: [0.0, 0.15]
    interstitial_fraction: [0.0, 0.10]
  # Small thermal rattling of every non-pristine structure: Maxwell-Boltzmann
  # displacements of an atom in a harmonic well of stiffness k at temperature
  # T (each component Gaussian with variance k_B*T/k, so the displacement
  # length follows the Maxwell distribution). T is drawn per structure; at
  # k = 5 eV/A^2, 50-500 K gives an rms displacement of 0.03-0.09 A per component.
  thermal_rattle:
    temperature_K: [50, 500]
    force_constant_eV_per_A2: 5.0
  strain_max: 0.05               # strained cells (non-pristine): each strain component in [-strain_max, +strain_max]
  slab_layers: 4
  interface_gap_A: [1.8, 2.6]    # film-substrate spacing
  interface_max_strain: 0.08     # largest lateral strain allowed to fit the film onto the substrate
  dimer_distance_scale: [0.8, 2.5]       # x (sum of covalent radii)
  repulsion_distance_scale: [0.35, 0.8]  # x (sum of covalent radii)
  adsorbate_height_A: [1.0, 3.0]

# Rounds 1..N: MD with the previous round's NEP, plus the round-0 families
# again, weighted toward the buckets with the worst test loss in the previous round.
rounds_1_to_N:
  md_fraction: 0.5               # share of the round that comes from MD (amorphous + collision)
  md_weights:
    amorphous: 1
    collision: 1
  snapshots_per_run: 5           # snapshots kept from each MD run
  amorphous:
    melt_temperature_K: [2000, 4000]
    quench_to_K: 300
    steps: 2000                  # half at the melt temperature, half quenching
    timestep_fs: 1.0
  collision:
    energy_eV: [0, 50]           # impact (kinetic) energy of the projectile
    max_polar_angle_deg: 60
    start_height_A: 5.0          # projectile start above the top surface atom
    surface_temperature_K: 300
    fixed_bottom_A: 2.0          # atoms this close to the slab bottom are held fixed
    steps: 1000
    timestep_fs: 0.25
