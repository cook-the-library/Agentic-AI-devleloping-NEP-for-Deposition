# Step 3: checks after every training round. ALL checks must pass for the
# round's NEP to become the final NEP; otherwise the round is repeated with
# more structures where the loss is worst.

check_a:
  # Held-out test loss (test.xyz, never trained on).
  energy_rmse_meV_per_atom_max: 10
  force_rmse_meV_per_A_max: 250
  # Stress: compared against the virial RMSE in meV/atom (the unit NEP reports
  # its stress loss in). Only structures in config/dft.yaml's virial_families
  # carry stress.
  stress_rmse_meV_per_atom_max: 250

check_b:
  # AIMD vs NEP energy trend while gas hits a substrate, a film, and a film on
  # substrate. The AIMD reference runs once (setup_check_b.py); every round
  # the NEP is evaluated on the same AIMD frames and the two E(t) curves are
  # compared after shifting both to start at zero.
  targets: [substrate, film, film_on_substrate]
  projectile: null                  # gas species name; null = first gas molecule (else first inert atom)
  impact_energy_eV: 10              # within the 0-50 eV collision range
  steps: 300
  timestep_fs: 0.5
  start_height_A: 4.0
  fixed_bottom_A: 2.0
  energy_trend_rmse_meV_per_atom_max: 10

rounds:
  max_round: 4                      # rounds r = 0 .. N with N = 4
